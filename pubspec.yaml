name: primio_app
description: A Primio-generated Flutter app
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  url_launcher: ^6.3.2
  share_plus: ^11.0.0
  wakelock_plus: ^1.3.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  vector_math: ^2.1.4
  archive: ^4.0.7
  package_info_plus: ^8.3.1
  flutter_compass: ^0.8.0
  sensors_plus: ^6.0.1
  vibration: ^2.0.0
  google_mobile_ads: ^5.1.0
